<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover でノッチ/ホームインジケーター領域に env(safe-area-inset-*) を効かせる -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS スタンドアロン表示（ステータスバーを透過させ全画面化） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ダメージ計算のみがわり" />
    <meta name="theme-color" content="#0d0f1a" />
    <title>ダメージ計算のみがわり</title>
    <!-- 分析ツール調デザイン用フォント: Hanken Grotesk（UI）/ DM Mono（数値・等幅）/ Noto Sans JP（和文） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        font-family: "Hanken Grotesk", -apple-system, "Noto Sans JP", system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
