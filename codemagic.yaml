workflows:
  # ── iOS (App Store / TestFlight) ──────────────────────────────
  ios-workflow:
    name: iOS Build (champcalc)
    max_build_duration: 60
    integrations:
      # Substrack と同じ App Store Connect 連携を流用（同一 Apple アカウント）
      app_store_connect: SubsTracker
    environment:
      vars:
        # App Store Connect のアプリ「Apple ID」(com.champcalc.app / ダメージ計算のみがわり)
        APP_APPLE_ID: "6778301151"
      node: 22.12.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        # npm ci ではなく npm install（Windows生成のlockに無いmacOS/Linux用optional依存をCIで解決）
        script: npm install

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Set build number
        script: |
          cd ios/App
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $(($LATEST_BUILD + 1))

      - name: Set up code signing
        script: |
          # 新規 Bundle ID のため、App Store 用の署名ファイルを作成/取得（--create で無ければ生成）
          keychain initialize
          app-store-connect fetch-signing-files \
            com.champcalc.app \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS (App Store)
        # Codemagic標準。use-profilesが用意した手動署名/export設定を使ってarchive→export一括
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - tim1209136@gmail.com
        notify:
          success: true
          failure: true
