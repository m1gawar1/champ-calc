<script type="text/babel">
const { useState, createContext, useContext } = React;

/* ====================================================================
   テーマシステム
   --------------------------------------------------------------------
   light/dark 両方ともLiquid Glass の要諦は同じ:
     1) 背景に色のあるグラデやモチーフ
     2) ガラスは半透明 + blur
     3) 内側ハイライト + 細いリム
   light は背景を高彩度パステル+白寄せ、ガラスのtintを白系に、テキストを濃色に。
   ==================================================================== */
const ThemeCtx = createContext('dark');

const TH = {

    text:        '#fff',
    textMuted:   'rgba(255,255,255,0.55)',
    textWeak:    'rgba(255,255,255,0.4)',

    tabInactive: 'rgba(255,255,255,0.6)',
    tabIconInactive: 'rgba(255,255,255,0.55)',
    badgeAtkBg: 'linear-gradient(180deg, rgba(120,220,255,0.95), rgba(70,180,250,0.85))',
    badgeAtkFg: '#0b1d2a',
    btnSoft:    'rgba(255,255,255,0.08)',
    btnSoftRim: 'rgba(255,255,255,0.18)',

    statusDark: true, // status bar/home indicator

  light: {
    text:        '#0d0f1a',
    textMuted:   'rgba(20,22,40,0.55)',
    textWeak:    'rgba(20,22,40,0.38)',
    accentAtk:   '#0a84d8',
    accentDef:   '#d23a4a',

    glassTint2:  'rgba(255,255,255,0.5)',
    glassDeep:   'rgba(255,255,255,0.62)',

    glassChip:   'rgba(255,255,255,0.6)',
    glassChip2:  'rgba(255,255,255,0.45)',
    rim:         'rgba(255,255,255,0.95)',
    rimAccent:   'rgba(60,160,240,0.7)',
    rimActive:   'rgba(60,160,240,0.85)',
    sheenTop:    0.7,
    sheenBottom: 0.05,
    track:       'rgba(20,22,40,0.08)',
    track2:      'rgba(20,22,40,0.06)',
    tabTint:     'rgba(255,255,255,0.55)',
    tabRim:      'rgba(255,255,255,0.95)',
    tabActiveBg: 'linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.65) 100%)',
    tabActiveShadow: 'inset 0 0 0 0.5px rgba(255,255,255,0.95), inset 0 1px 0 rgba(255,255,255,1), 0 4px 12px rgba(0,40,90,0.12)',
    tabInactive: 'rgba(20,22,40,0.6)',
    tabIconInactive: 'rgba(20,22,40,0.5)',
    badgeAtkBg: 'linear-gradient(180deg, #5AC8FA, #1a9fef)',
    badgeAtkFg: '#fff',
    btnSoft:    'rgba(255,255,255,0.7)',
    btnSoftRim: 'rgba(255,255,255,0.95)',
    dashedRim:  'rgba(20,22,40,0.18)',
    statusDark: false,
  },
};
const useTheme = () => TH[useContext(ThemeCtx)];

/* ─── Liquid Glass primitives ─────────────────────────────── */
function GlassLayers({ tint, radius = 24, blur = 28, rim, sheenTop, sheenBottom }) {
  const t = useTheme();
  return (
    <>
      <div style={{ position: 'absolute', inset: 0, borderRadius: radius,
        backdropFilter: `blur(${blur}px) saturate(190%)`,
        WebkitBackdropFilter: `blur(${blur}px) saturate(190%)`,
        background: tint || t.glassTint, zIndex: 0 }} />
      <div style={{ position: 'absolute', inset: 0, borderRadius: radius,
        background: `linear-gradient(180deg, rgba(255,255,255,${sheenTop ?? t.sheenTop}) 0%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 70%, rgba(255,255,255,${sheenBottom ?? t.sheenBottom}) 100%)`,
        zIndex: 1, pointerEvents: 'none' }} />
      <div style={{ position: 'absolute', inset: 0, borderRadius: radius,
        boxShadow: `inset 0 0 0 0.5px ${rim || t.rim}, inset 0 1px 0 rgba(255,255,255,${useContext(ThemeCtx) === 'dark' ? 0.22 : 0.85})`,
        zIndex: 2, pointerEvents: 'none' }} />
    </>
  );
}
function Glass({ children, radius = 24, tint, style, blur, rim, padding = 16, sheenTop, sheenBottom }) {
  return (
    <div style={{ position: 'relative', borderRadius: radius, overflow: 'hidden', isolation: 'isolate', ...style }}>
      <GlassLayers tint={tint} radius={radius} blur={blur} rim={rim} sheenTop={sheenTop} sheenBottom={sheenBottom} />
      <div style={{ position: 'relative', zIndex: 3, padding }}>{children}</div>
    </div>
  );
}

/* ─── Backdrops per (theme, screen) ─────────────────────────── */

        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(60% 40% at 20% 15%, rgba(40,210,200,0.55) 0%, rgba(40,210,200,0) 70%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(50% 32% at 85% 60%, rgba(170,120,255,0.5) 0%, rgba(170,120,255,0) 70%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(40% 28% at 50% 90%, rgba(90,200,250,0.42) 0%, rgba(90,200,250,0) 70%)' }} />
      </div>
    ),
    history: (
      <div style={{ position: 'absolute', inset: 0, borderRadius: 'inherit', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, #2c0e3d 0%, #1a0a2c 55%, #07051a 100%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(55% 36% at 80% 18%, rgba(255,150,90,0.55) 0%, rgba(255,150,90,0) 70%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(45% 30% at 18% 75%, rgba(120,90,255,0.55) 0%, rgba(120,90,255,0) 70%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(40% 28% at 60% 50%, rgba(255,90,160,0.4) 0%, rgba(255,90,160,0) 70%)' }} />
      </div>
    ),
  },
  light: {
    calc: (
      <div style={{ position: 'absolute', inset: 0, borderRadius: 'inherit', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, #d8ecff 0%, #f5e9ff 50%, #ffeaf2 100%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(55% 36% at 18% 18%, rgba(120,200,255,0.95) 0%, rgba(120,200,255,0) 70%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(45% 30% at 82% 28%, rgba(255,180,200,0.85) 0%, rgba(255,180,200,0) 70%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(40% 28% at 50% 85%, rgba(180,230,210,0.85) 0%, rgba(180,230,210,0) 70%)' }} />
      </div>
    ),
    party: (
      <div style={{ position: 'absolute', inset: 0, borderRadius: 'inherit', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, #e6f5ff 0%, #d6eef5 60%, #fff5e0 100%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(60% 40% at 25% 18%, rgba(140,220,255,0.95) 0%, rgba(140,220,255,0) 70%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(48% 32% at 85% 65%, rgba(220,200,255,0.9) 0%, rgba(220,200,255,0) 70%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(40% 28% at 50% 90%, rgba(255,220,180,0.8) 0%, rgba(255,220,180,0) 70%)' }} />
      </div>
    ),
    history: (
      <div style={{ position: 'absolute', inset: 0, borderRadius: 'inherit', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, #fff0e8 0%, #f6e8ff 55%, #e8edff 100%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(55% 36% at 80% 18%, rgba(255,200,160,0.9) 0%, rgba(255,200,160,0) 70%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(45% 30% at 18% 78%, rgba(200,180,255,0.85) 0%, rgba(200,180,255,0) 70%)' }} />
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(40% 28% at 60% 50%, rgba(255,180,210,0.7) 0%, rgba(255,180,210,0) 70%)' }} />
      </div>
    ),
  },
};

/* ─── Type pill ─────────────────────────────── */
const TYPE_COLORS = {
  でんき: { bg: 'rgba(255,210,0,0.85)', fg: '#3a2a00' },
  ほのお: { bg: 'rgba(255,120,60,0.85)', fg: '#fff' },
  みず: { bg: 'rgba(80,160,255,0.85)', fg: '#fff' },
  くさ: { bg: 'rgba(90,210,130,0.85)', fg: '#0d2a18' },
  こおり: { bg: 'rgba(140,230,255,0.85)', fg: '#0a2734' },
  はがね: { bg: 'rgba(180,190,210,0.85)', fg: '#1a2030' },
  フェアリー: { bg: 'rgba(255,170,210,0.9)', fg: '#3a0a24' },
  ドラゴン: { bg: 'rgba(120,90,230,0.85)', fg: '#fff' },
  あく: { bg: 'rgba(70,55,55,0.92)', fg: '#fff' },
  じめん: { bg: 'rgba(200,160,90,0.9)', fg: '#33240a' },
  ひこう: { bg: 'rgba(150,170,230,0.9)', fg: '#1a2050' },
  エスパー: { bg: 'rgba(255,110,170,0.88)', fg: '#fff' },
  ノーマル: { bg: 'rgba(180,180,170,0.88)', fg: '#1a1a14' },
  ゴースト: { bg: 'rgba(120,90,160,0.88)', fg: '#fff' },
  どく: { bg: 'rgba(170,90,180,0.88)', fg: '#fff' },
  むし: { bg: 'rgba(170,200,80,0.88)', fg: '#1a2008' },
  いわ: { bg: 'rgba(180,160,110,0.9)', fg: '#1a1208' },
};
function TypePill({ t, size = 11 }) {
  const c = TYPE_COLORS[t] || { bg: 'rgba(120,120,120,0.6)', fg: '#fff' };
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      padding: '3px 9px', borderRadius: 999, fontSize: size, fontWeight: 700,
      background: c.bg, color: c.fg, letterSpacing: 0.2,
      boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.4), 0 1px 2px rgba(0,0,0,0.15)' }}>{t}</span>
  );
}

/* ─── Floating Tab Bar ─────────────────────────────── */
function TabBar({ active, onChange }) {
  const t = useTheme();
  const tabs = [
    { key: 'calc', label: 'ダメ計', icon: (c) => (
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="3" y="2.5" width="16" height="17" rx="3.4" stroke={c} strokeWidth="1.6"/>
        <rect x="6" y="5.5" width="10" height="3.4" rx="1.2" fill={c} opacity="0.45"/>
        <circle cx="7.2" cy="12.2" r="1.1" fill={c}/><circle cx="11" cy="12.2" r="1.1" fill={c}/>
        <circle cx="14.8" cy="12.2" r="1.1" fill={c}/><circle cx="7.2" cy="15.8" r="1.1" fill={c}/>
        <circle cx="11" cy="15.8" r="1.1" fill={c}/>
        <rect x="13.7" y="14.7" width="2.2" height="2.2" rx="0.6" fill={c}/>
      </svg>
    ) },
    { key: 'party', label: 'パーティ', icon: (c) => (
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="7.5" cy="8" r="3.2" stroke={c} strokeWidth="1.6"/>
        <circle cx="14.5" cy="8" r="3.2" stroke={c} strokeWidth="1.6"/>
        <path d="M2 18.5c0-2.6 2.5-4.4 5.5-4.4s5.5 1.8 5.5 4.4" stroke={c} strokeWidth="1.6" strokeLinecap="round"/>
        <path d="M11.2 14.4c.95-.2 2.05-.3 3.3-.3 3 0 5.5 1.8 5.5 4.4" stroke={c} strokeWidth="1.6" strokeLinecap="round"/>
      </svg>
    ) },
    { key: 'history', label: '履歴', icon: (c) => (
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M11 3.5a7.5 7.5 0 1 1-7.4 8.6" stroke={c} strokeWidth="1.6" strokeLinecap="round"/>
        <path d="M3.5 4.2v3.6h3.6" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
        <path d="M11 7v4.2l2.8 1.7" stroke={c} strokeWidth="1.6" strokeLinecap="round"/>
      </svg>
    ) },
  ];
  return (
    <div style={{ position: 'absolute', left: 18, right: 18, bottom: 26, zIndex: 80,
      borderRadius: 30, overflow: 'hidden' }}>
      <GlassLayers tint={t.tabTint} radius={30} blur={30} rim={t.tabRim} />
      <div style={{ position: 'relative', zIndex: 3, display: 'flex', height: 60, padding: 6, gap: 4 }}>
        {tabs.map(tb => {
          const isActive = active === tb.key;
          return (
            <button key={tb.key} onClick={() => onChange(tb.key)}
              style={{ flex: isActive ? 1.4 : 1, position: 'relative',
                background: 'transparent', border: 0, cursor: 'pointer',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                gap: 7, color: isActive ? t.text : t.tabInactive,
                fontFamily: '-apple-system, "Noto Sans JP", system-ui',
                fontSize: 13, fontWeight: 700, letterSpacing: 0.2,
                borderRadius: 24, padding: '0 10px',
                transition: 'all 0.25s cubic-bezier(0.4,0,0.2,1)' }}>
              {isActive && (
                <span style={{ position: 'absolute', inset: 0, borderRadius: 24,
                  background: t.tabActiveBg, boxShadow: t.tabActiveShadow, zIndex: -1 }} />
              )}
              {tb.icon(isActive ? t.text : t.tabIconInactive)}
              {isActive && <span>{tb.label}</span>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ─── ダメ計画面 ─────────────────────────────── */

            {['ランドロス','カイオーガ','ザシアン','レジエレキ'].map((p, i) => (
              <span key={p} style={{ fontSize: 11, fontWeight: 600, padding: '5px 9px', borderRadius: 999,

          </div>

        </div>

          <TypePill t="ドラゴン" /><TypePill t="じめん" />

/* ─── Phone shell ─────────────────────────────── */
function Phone({ initialTab = 'calc', theme = 'dark' }) {
  const [tab, setTab] = useState(initialTab);
  const Screen = tab === 'calc' ? CalcScreen : tab === 'party' ? PartyScreen : HistoryScreen;
  return (
    <ThemeCtx.Provider value={theme}>
      <IOSDevice width={390} height={844} dark={theme === 'dark'}>
        <div style={{ position: 'absolute', inset: 0, borderRadius: 'inherit', overflow: 'hidden' }}>
          {BACKDROPS[theme][tab]}
          <div style={{ position: 'absolute', inset: 0, overflow: 'auto' }}>
            <Screen />
          </div>
          <TabBar active={tab} onChange={setTab} />
        </div>
      </IOSDevice>
    </ThemeCtx.Provider>
  );
}

  return (
    <DesignCanvas title="ダメ計アプリ — Liquid Glass" subtitle="Light + Dark / フローティングタブ / 6画面">

}
