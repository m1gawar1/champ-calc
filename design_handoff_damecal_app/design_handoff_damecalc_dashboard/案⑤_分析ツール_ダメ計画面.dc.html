<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; }
</style>
</helmet>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#e7e5df; padding:48px; font-family:'Hanken Grotesk',-apple-system,'Noto Sans JP',sans-serif;">
  <div style="width:393px; height:852px; border-radius:46px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,0.16); background:#eceef0; background-image:linear-gradient(#dde1e4 1px,transparent 1px),linear-gradient(90deg,#dde1e4 1px,transparent 1px); background-size:26px 26px; position:relative; display:flex; flex-direction:column; font-family:'DM Mono',monospace;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 30px 0; font-size:13px; color:#15202b; font-weight:500;">
      <span>21:30</span>
      <span style="letter-spacing:2px; opacity:0.7;">●●● ▮</span>
    </div>
    <div style="flex:1; padding:18px 20px 0; overflow:hidden;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div style="font-family:'Hanken Grotesk',sans-serif; font-size:13px; font-weight:800; color:#15202b; letter-spacing:0.04em;">DAMAGE_CALC</div>
        <div style="font-size:10px; color:#fff; background:#0a96b8; padding:3px 8px; border-radius:3px;">SINGLES</div>
      </div>

      <!-- matchup grid -->
      <div style="margin-top:16px; display:grid; grid-template-columns:1fr auto 1fr; gap:0; border:1px solid #c6ccd1; background:#fff; border-radius:6px; overflow:hidden;">
        <div style="padding:12px 13px;">
          <div style="font-size:9px; color:#0a96b8; letter-spacing:0.08em;">ATK //</div>
          <div style="font-family:'Hanken Grotesk',sans-serif; font-size:16px; font-weight:800; color:#15202b; margin-top:5px;">ガブリアス</div>
          <div style="display:flex; gap:4px; margin-top:8px;">
            <span style="font-size:9px; font-weight:700; padding:2px 6px; border-radius:3px; color:#fff; background:#6B4FE0;">DRAGON</span>
            <span style="font-size:9px; font-weight:700; padding:2px 6px; border-radius:3px; color:#3a2c11; background:#D4A95A;">GROUND</span>
          </div>
        </div>
        <div style="width:1px; background:#c6ccd1;"></div>
        <div style="padding:12px 13px; text-align:right;">
          <div style="font-size:9px; color:#8a949c; letter-spacing:0.08em;">// DEF</div>
          <div style="font-family:'Hanken Grotesk',sans-serif; font-size:16px; font-weight:800; color:#15202b; margin-top:5px;">パオジアン</div>
          <div style="display:flex; gap:4px; margin-top:8px; justify-content:flex-end;">
            <span style="font-size:9px; font-weight:700; padding:2px 6px; border-radius:3px; color:#fff; background:#4A4655;">DARK</span>
            <span style="font-size:9px; font-weight:700; padding:2px 6px; border-radius:3px; color:#14474d; background:#9BDAE3;">ICE</span>
          </div>
        </div>
      </div>

      <!-- move row -->
      <div style="margin-top:12px; border:1px solid #c6ccd1; background:#fff; border-radius:6px; padding:10px 13px; display:flex; align-items:center; justify-content:space-between;">
        <div style="display:flex; align-items:center; gap:9px;">
          <span style="font-size:9px; font-weight:700; padding:2px 6px; border-radius:3px; color:#3a2c11; background:#D4A95A;">GND</span>
          <span style="font-family:'Hanken Grotesk',sans-serif; font-size:15px; font-weight:800; color:#15202b;">じしん</span>
        </div>
        <span style="font-size:12px; color:#5a646c;">PWR 100 · PHYS</span>
      </div>

      <!-- result panel -->
      <div style="margin-top:12px; border:1px solid #0a96b8; background:#fff; border-radius:6px; overflow:hidden;">
        <div style="display:flex; border-bottom:1px solid #d8dde1;">
          <div style="flex:1; padding:12px 13px; border-right:1px solid #d8dde1;">
            <div style="font-size:9px; color:#8a949c; letter-spacing:0.06em;">DMG_RANGE</div>
            <div style="font-size:26px; font-weight:500; color:#15202b; margin-top:4px; letter-spacing:-0.01em;">185–218</div>
          </div>
          <div style="flex:1; padding:12px 13px;">
            <div style="font-size:9px; color:#8a949c; letter-spacing:0.06em;">PERCENT</div>
            <div style="font-size:26px; font-weight:500; color:#0a96b8; margin-top:4px;">92.0%</div>
          </div>
        </div>
        <div style="padding:12px 13px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:9px;">
            <span style="font-size:9px; color:#8a949c; letter-spacing:0.06em;">ROLL · 16</span>
            <span style="font-family:'Hanken Grotesk',sans-serif; font-size:12px; font-weight:800; color:#15202b; background:#e3f4f8; padding:2px 9px; border-radius:3px;">確定2発</span>
          </div>
          <div style="display:flex; gap:2px;">
            <div style="flex:1; height:9px; background:#0a96b8;"></div><div style="flex:1; height:9px; background:#0a96b8;"></div><div style="flex:1; height:9px; background:#0a96b8;"></div><div style="flex:1; height:9px; background:#0a96b8;"></div><div style="flex:1; height:9px; background:#0a96b8;"></div><div style="flex:1; height:9px; background:#0a96b8;"></div><div style="flex:1; height:9px; background:#0a96b8;"></div><div style="flex:1; height:9px; background:#0a96b8;"></div><div style="flex:1; height:9px; background:#0a96b8;"></div><div style="flex:1; height:9px; background:#0a96b8;"></div><div style="flex:1; height:9px; background:#0a96b8;"></div><div style="flex:1; height:9px; background:#0a96b8;"></div>
            <div style="flex:1; height:9px; background:#cdd3d8;"></div><div style="flex:1; height:9px; background:#cdd3d8;"></div><div style="flex:1; height:9px; background:#cdd3d8;"></div><div style="flex:1; height:9px; background:#cdd3d8;"></div>
          </div>
        </div>
      </div>

      <!-- sliders -->
      <div style="margin-top:16px; font-size:9px; color:#8a949c; letter-spacing:0.08em; margin-bottom:12px;">DEF_EV //</div>
      <div style="margin-bottom:15px;">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;">
          <div style="font-family:'Hanken Grotesk',sans-serif; font-size:12px; font-weight:800; color:#15202b;">HP <span style="font-family:'DM Mono',monospace; color:#8a949c; font-weight:400; font-size:11px;">20</span></div>
          <div style="font-size:14px; font-weight:500; color:#0a96b8;">191</div>
        </div>
        <div style="display:flex; align-items:center; gap:9px;">
          <span style="font-size:10px; color:#aab2b8;">0</span>
          <div style="flex:1; height:4px; background:#d3d9dd; position:relative; border-radius:2px;">
            <div style="position:absolute; left:0; top:0; bottom:0; width:62%; background:#0a96b8; border-radius:2px;"></div>
            <div style="position:absolute; left:62%; top:50%; width:12px; height:12px; background:#fff; border:2px solid #0a96b8; border-radius:50%; transform:translate(-50%,-50%);"></div>
          </div>
          <span style="font-size:10px; color:#aab2b8;">MAX</span>
        </div>
      </div>
      <div>
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;">
          <div style="font-family:'Hanken Grotesk',sans-serif; font-size:12px; font-weight:800; color:#15202b;">DEF <span style="font-family:'DM Mono',monospace; color:#8a949c; font-weight:400; font-size:11px;">12</span></div>
          <div style="font-size:14px; font-weight:500; color:#0a96b8;">130</div>
        </div>
        <div style="display:flex; align-items:center; gap:9px;">
          <span style="font-size:10px; color:#aab2b8;">0</span>
          <div style="flex:1; height:4px; background:#d3d9dd; position:relative; border-radius:2px;">
            <div style="position:absolute; left:0; top:0; bottom:0; width:38%; background:#0a96b8; border-radius:2px;"></div>
            <div style="position:absolute; left:38%; top:50%; width:12px; height:12px; background:#fff; border:2px solid #0a96b8; border-radius:50%; transform:translate(-50%,-50%);"></div>
          </div>
          <span style="font-size:10px; color:#aab2b8;">MAX</span>
        </div>
      </div>
    </div>

    <!-- tab bar -->
    <div style="border-top:1px solid #c6ccd1; background:#fbfcfc; padding:12px 24px 28px; display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:4px; color:#0a96b8;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="8" x2="15" y2="8"/></svg>
        <span style="font-family:'Hanken Grotesk',sans-serif; font-size:9px; font-weight:800;">ダメ計</span>
      </div>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a7afb5" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.4"/><path d="M4 19c0-3 2.5-5 5-5s5 2 5 5"/></svg>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a7afb5" stroke-width="2"><polygon points="13 2 4 14 11 14 10 22 19 9 12 9 13 2"/></svg>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a7afb5" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a7afb5" stroke-width="2"><line x1="4" y1="8" x2="20" y2="8"/><circle cx="15" cy="8" r="2.2" fill="#fbfcfc"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="9" cy="16" r="2.2" fill="#fbfcfc"/></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
